<ion-app>
  <div *ngIf="showSplash" class="app-splash">
    <img src="assets/icon/Alertlogo.png" alt="AlertBxt" width="128" height="128" decoding="async" />
    <span>AlertBxt</span>
  </div>

  <ion-split-pane contentId="main-content" when="lg" [disabled]="!isLoggedIn">
    <ion-menu *ngIf="isLoggedIn" contentId="main-content" type="overlay" menuId="main-menu" class="ab-sidebar">
      <ion-content class="sidebar-content">
        <div class="sidebar-card">
          <div class="sidebar-brand">
            <img src="assets/icon/Alertlogo.png" alt="" width="30" height="30" />
            <span>AlertBxt</span>
            <button type="button" class="sidebar-theme sidebar-theme--brand" (click)="alternarTema()" [attr.aria-label]="temaOscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'">
              <ion-icon [name]="temaOscuro ? 'sunny-outline' : 'moon-outline'"></ion-icon>
            </button>
          </div>

          <ion-list class="sidebar-list" lines="none">
            <ion-item button lines="none" class="sidebar-item" [class.sidebar-item-active]="isActive('/alertas-eventos')" (click)="goToAlertasyEventos()" data-tour="alertas">
              <ion-icon slot="start" name="alert-circle"></ion-icon>
              <ion-label>Alertas y eventos</ion-label>
            </ion-item>

            <ion-item *ngIf="currentUser?.rol === 'admin'" button lines="none" class="sidebar-item" [class.sidebar-item-active]="isActive('/gestion-avisos')" (click)="goToGestionAvisos()" data-tour="avisos">
              <ion-icon slot="start" name="notifications"></ion-icon>
              <ion-label>Gestión de avisos</ion-label>
            </ion-item>

            <ion-item button lines="none" class="sidebar-item" [class.sidebar-item-active]="isActive('/recordatorios')" (click)="goToRecordatorios()" data-tour="recordatorios">
              <ion-icon slot="start" name="calendar"></ion-icon>
              <ion-label>Recordatorios</ion-label>
            </ion-item>

            <ion-item *ngIf="currentUser?.rol === 'admin'" button lines="none" class="sidebar-item" [class.sidebar-item-active]="isActive('/gestion-usuarios')" (click)="goToGestionUsuarios()" data-tour="vecinos">
              <ion-icon slot="start" name="people"></ion-icon>
              <ion-label>Gestión de vecinos</ion-label>
            </ion-item>

            <ion-item *ngIf="currentUser?.rol === 'admin'" button lines="none" class="sidebar-item" [class.sidebar-item-active]="isActive('/estadisticas')" (click)="goToEstadisticas()" data-tour="estadisticas">
              <ion-icon slot="start" name="stats-chart"></ion-icon>
              <ion-label>Estadísticas</ion-label>
            </ion-item>

            <ion-item *ngIf="!currentUser?.comunidadId" button lines="none" class="sidebar-item" [class.sidebar-item-active]="isActive('/unirse-vecindad')" (click)="goToUnirseVecindad()">
              <ion-icon slot="start" name="people"></ion-icon>
              <ion-label>Unirme a una vecindad</ion-label>
            </ion-item>

            <ion-item button lines="none" class="sidebar-item" [class.sidebar-item-active]="isActive('/mensajes')" (click)="goToMensajes()" data-tour="mensajes">
              <ion-icon slot="start" name="chatbubble-ellipses"></ion-icon>
              <ion-label>Mensajes</ion-label>
            </ion-item>

            <ion-item button lines="none" class="sidebar-item" [class.sidebar-item-active]="isActive('/perfil-usuario')" (click)="goToPerfilUsuario()" data-tour="perfil">
              <ion-icon slot="start" name="person"></ion-icon>
              <ion-label>Perfil</ion-label>
            </ion-item>

            <ion-item button lines="none" class="sidebar-item" [class.sidebar-item-active]="isActive('/guia-uso')" (click)="goToGuiaUso()" data-tour="guia">
              <ion-icon slot="start" name="help-circle-outline"></ion-icon>
              <ion-label>Guía de uso</ion-label>
            </ion-item>
          </ion-list>

          <ion-item *ngIf="isMobileDevice && (canInstallPwa || showIosInstallHelp)" button lines="none" class="sidebar-item install-item" (click)="installPwa()">
            <ion-icon slot="start" name="download"></ion-icon>
            <ion-label>Instalar app</ion-label>
          </ion-item>

          <div class="sidebar-footer">
            <div class="sidebar-user">
              <ion-icon name="person-circle" class="sidebar-user-icon"></ion-icon>
              <span class="sidebar-user-name">{{ nombreUsuario || 'Usuario' }}</span>
            </div>
            <button type="button" class="sidebar-logout" (click)="logout()" aria-label="Cerrar sesión">
              <ion-icon name="log-out"></ion-icon>
            </button>
          </div>
        </div>
      </ion-content>
    </ion-menu>

    <div id="main-content" class="main-content">
      <ion-header *ngIf="isLoggedIn" class="top-header">
        <ion-toolbar>
          <div slot="start" class="brand-chip">
            <span class="brand-dot" aria-hidden="true"></span>
            AlertBxt
          </div>

          <ion-buttons slot="end" class="user-info">
            <ion-button fill="clear" (click)="alternarTema()" [attr.aria-label]="temaOscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'">
              <ion-icon [name]="temaOscuro ? 'sunny-outline' : 'moon-outline'" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-button fill="clear" (click)="goToGuiaUso()" data-tour="guia" aria-label="Ver guía de uso">
              <ion-icon name="help-circle-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-label>{{ nombreUsuario || "Usuario" }}</ion-label>
            <ion-button fill="clear" (click)="logout()" aria-label="Cerrar sesión">
              <ion-icon name="log-out" slot="icon-only"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>

        <button
          *ngIf="isMobileDevice && (canInstallPwa || showIosInstallHelp)"
          type="button"
          class="install-banner"
          (click)="installPwa()"
        >
          <ion-icon name="download"></ion-icon>
          <span>Instala AlertBxt en tu pantalla de inicio</span>
        </button>
      </ion-header>

      <router-outlet></router-outlet>

      <nav *ngIf="isLoggedIn" class="bottom-tabs" aria-label="Navegación principal">
        <button type="button" class="tab-btn" [class.tab-active]="isActive('/alertas-eventos')" (click)="goToAlertasyEventos()" data-tour="alertas">
          <ion-icon name="alert-circle"></ion-icon>
          <span>Alertas</span>
        </button>

        <button *ngIf="currentUser?.rol === 'admin'" type="button" class="tab-btn" [class.tab-active]="isActive('/gestion-avisos')" (click)="goToGestionAvisos()" data-tour="avisos">
          <ion-icon name="notifications"></ion-icon>
          <span>Avisos</span>
        </button>

        <button type="button" class="tab-btn" [class.tab-active]="isActive('/recordatorios')" (click)="goToRecordatorios()" data-tour="recordatorios">
          <ion-icon name="calendar"></ion-icon>
          <span>Recordar</span>
        </button>

        <button *ngIf="currentUser?.rol === 'admin'" type="button" class="tab-btn" [class.tab-active]="isActive('/gestion-usuarios')" (click)="goToGestionUsuarios()" data-tour="vecinos">
          <ion-icon name="people"></ion-icon>
          <span>Vecinos</span>
        </button>

        <button *ngIf="currentUser?.rol === 'admin'" type="button" class="tab-btn" [class.tab-active]="isActive('/estadisticas')" (click)="goToEstadisticas()" data-tour="estadisticas">
          <ion-icon name="stats-chart"></ion-icon>
          <span>Estad.</span>
        </button>

        <button *ngIf="!currentUser?.comunidadId" type="button" class="tab-btn" [class.tab-active]="isActive('/unirse-vecindad')" (click)="goToUnirseVecindad()">
          <ion-icon name="people"></ion-icon>
          <span>Unirme</span>
        </button>

        <button type="button" class="tab-btn" [class.tab-active]="isActive('/mensajes')" (click)="goToMensajes()" data-tour="mensajes">
          <ion-icon name="chatbubble-ellipses"></ion-icon>
          <span>Mensajes</span>
        </button>

        <button type="button" class="tab-btn" [class.tab-active]="isActive('/perfil-usuario')" (click)="goToPerfilUsuario()" data-tour="perfil">
          <ion-icon name="person"></ion-icon>
          <span>Perfil</span>
        </button>
      </nav>

      <button
        *ngIf="isLoggedIn"
        type="button"
        class="sos-fab" data-tour="sos"
        [class.sos-fab--sosteniendo]="sosSosteniendo"
        (pointerdown)="iniciarSostenidoSos()"
        (pointerup)="cancelarSostenidoSos()"
        (pointerleave)="cancelarSostenidoSos()"
        (pointercancel)="cancelarSostenidoSos()"
        (keydown.enter)="iniciarSostenidoSos()"
        (keydown.space)="iniciarSostenidoSos()"
        (keyup.enter)="cancelarSostenidoSos()"
        (keyup.space)="cancelarSostenidoSos()"
        (contextmenu)="$event.preventDefault()"
        [disabled]="!currentUser?.comunidadId"
        aria-label="Mantén presionado 1.5 segundos para generar una alerta de emergencia SOS"
      >
        <svg class="sos-fab-ring" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="sos-fab-ring-track" cx="32" cy="32" r="29"></circle>
          <circle class="sos-fab-ring-progress" cx="32" cy="32" r="29"></circle>
        </svg>
        <span class="sos-fab-label">SOS</span>
      </button>
    </div>
  </ion-split-pane>
</ion-app>
